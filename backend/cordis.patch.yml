# dsh-superagent bundle layer: inserts the plugins without configuration, and the agent presets its Sessions run under. The
# profile supplies the `dsh-superagent` entry's stateDir (see docs/006-deployment.md and examples/profile.cordis.patch.yml); the plugin
# refuses to start without stateDir.
- insert:
    - id: dsh-superagent
      name: dsh-superagent
    - id: dsh-superagent-github
      name: dsh-superagent/github-watch
    # Optional Feishu Source; requires configuring a bot CLI after enabling.
    - id: dsh-superagent-feishu
      name: dsh-superagent/feishu-watch
      disabled: true
    # Mobile Source: reads the local message queue (tools/mobileq). Disabled while the crew Source is on: both read the
    # same queue, so two enabled instances would take every message twice and answer it twice.
    - id: dsh-superagent-mobile
      name: dsh-superagent/mobile
      disabled: true
    # Bot crew Source: same queue, routed by mention; the default bot answers when nobody is named. It takes over the
    # phone queue from the mobile Source, so exactly one of the two is enabled at a time.
    - id: dsh-superagent-team
      name: dsh-superagent/team
    # The agent preset of every Executor Session (WORKER_PRESET in src/app/sessions.ts); the main Session has its own, below.
    # It is DSH's `standard` preset with only what a worker needs, and a shell whose foreground command moves to a background job
    # after 5 seconds, so a long command does not hold back a person's message, which the Session takes at its next step. Left
    # out: questions to a person, presenting, plan mode, the plugin manager and market, scheduling, goals, workflows, web fetch,
    # and forked subagents, which would run under this preset; spawned subagents run under `standard`, whose shell moves a
    # command to a background job only after 60 seconds, as a subagent's jobs are killed when it ends. A preset row has no
    # setting that hides it from the preset picker, so its name and description say whom it is for.
    - id: dsh-superagent-worker-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-superagent-worker
        name: dsh-superagent 执行器
        description: dsh-superagent 的执行器 Session 专用，不供手动选择。前台命令超 5 秒转入后台，只含执行工作所需的工具。
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # A foreground command waits at most 5 s, then the shell tool moves it to a background job.
          - id: shell
            name: cordis:group
            group: true
            isolate:
              shell: true
              # 隔离 worker 的 shell 到自己的 `sandbox` 服务实例：只有这个组里的 `bash-sandbox` 解析到下面挂的
              # `WorkerSandboxProvider`，主会话 / router 的 shell 组仍用 DSH 自带的全局 `sandbox`（不受影响）。
              sandbox: true
            config:
              # backend 自己的 worker sandbox provider：profile 在写白名单外加 deny 读 `sensitivePaths()`，
              # 补上 DSH 自带 seatbelt「只限写、不限读」的缺口（ADR 0004 gap 3 / #22）。
              # 只有 executor.isolation === 'sandbox' 时 sessions.ts 才把 worker 翻到 workspace-write 让这条生效。
              - id: worker-sandbox
                name: dsh-superagent/worker-sandbox
              - id: bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: pwsh-sandbox
                name: '@deepseek-ai/dsh-pwsh-sandbox'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
          # 文件工具读面隔离（task-5 / #22 补口）：把 worker 的 fs 工具收进一个 isolate 了 `fs`
          # 和 `sandbox` 的组。组里挂 backend 的 `WorkerFileSystem` 作为这一组自己的 `ctx.fs`——
          # 读方法（read/read_image 走 ctx.fs）进隔离子进程（固定 helper + 同组 WorkerSandboxProvider
          # 的 seatbelt profile：写白名单 + 凭据读 deny），写/改/删原样委托内层全局 fs-sandbox 的
          # per-call policy fence。**默认 none 透传**：权限只按真实 per-session（agents.currentInitiator()
          # → 该会话 mode）判；confining 会话读进隔离、显式 none 读透传、缺会话上下文 fail-closed。
          # 主会话（router）自己的 tool-fs 在 router preset 里，仍用全局 fs-sandbox，不受影响。
          # 边界：`glob`/`grep` 不经 ctx.fs，由下面的 file-search 组单独隔离（见下）。
          - id: fs
            name: cordis:group
            group: true
            isolate:
              fs: true
              # 让组内 `ctx.sandbox` 解析到下面挂的 `worker-sandbox`（与 shell 组同一 provider，
              # 同一份 profile），WorkerFileSystem 的 confine() 才用对策略。
              sandbox: true
            config:
              - id: worker-fs-sandbox
                name: dsh-superagent/worker-sandbox
              - id: worker-fs
                name: dsh-superagent/worker-fs
              - id: tool-fs
                name: '@deepseek-ai/dsh-tool-fs'
          # glob/grep 读面隔离（task-5 / #22 补口）：`glob`/`grep` 不走 ctx.fs，而是
          # `ctx.subprocess.spawn` 跑打包 ripgrep（注入 subprocess、不注入 fs/sandbox，源码注释
          # "spawn is unconfined"）。所以给 file-search 单独一个 isolate 了 `subprocess` 的组，挂
          # backend 的 `WorkerSearchSubprocess`：把 ripgrep 的 spawn 包进与 fs/shell 同一份
          # seatbelt profile（写白名单 + 凭据读 deny）内执行——rg 打开敏感文件命中内核拒绝。
          # **不嵌套 sandbox-exec**：shell 组 / fs 组 / 本组是三个兄弟 scope，各自 isolate 自己的
          # 服务，互不嵌套。**默认 none 透传**：与 WorkerFileSystem 同一套 per-session 判定。
          - id: file-search
            name: cordis:group
            group: true
            isolate:
              subprocess: true
            config:
              - id: worker-search-subprocess
                name: dsh-superagent/worker-search-subprocess
              - id: tool-fs-search
                name: '@deepseek-ai/dsh-tool-fs-search'
                config:
                  sampleOverCapGlobResults: false
          # A wait for a job ends after 5 s too; the job's end wakes the worker with its result.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            config:
              waitTimeoutMs: 5000
              maxWaitTimeoutMs: 5000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
                  agentPreset: standard
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
    # The agent preset of the main Session (ROUTER_PRESET in src/app/sessions.ts). The worker's 5-second shell and job waits, so a command or a wait does not hold back the next candidates, and
    # only what the main Session uses: no subagents, web, file search or writes, todo list, questions to a person, presenting,
    # plan mode, plugin manager, scheduling, goals or workflows. No persona: the main Session's prompt is complete, so it has
    # no other section.
    - id: dsh-superagent-router-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-superagent-router
        name: dsh-superagent 主 Session
        description: dsh-superagent 的主 Session 专用，不供手动选择。前台命令和任务等待超 5 秒转入后台，只含路由所需的工具。
        order: 91
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: pwsh-sandbox
                name: '@deepseek-ai/dsh-pwsh-sandbox'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            config:
              waitTimeoutMs: 5000
              maxWaitTimeoutMs: 5000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
