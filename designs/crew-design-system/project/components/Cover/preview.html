<!-- @dsCard height=288 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; background:var(--surface); }
  .name { fill:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
          font-size:96px; font-weight:640; letter-spacing:-2px; }
  .tagline { fill:var(--muted); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
             font-size:14px; font-weight:400; }
  .brand { fill:var(--accent); }
  .deep { fill:var(--ink); }
  .signal { fill:var(--warn); }
  .relief { fill:var(--tertiary); }
  .alert { fill:var(--danger); }
  .dot { fill:var(--card); }
  .tile { rx:var(--radius-lg); }
  .chip { rx:var(--radius-sm); }
</style>
</head>
<body>
<svg width="960" height="288" viewBox="0 0 960 288" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crew design system cover">
<!--
blocks: accent slab 180x208, ink merged-two-wide 204x96, warn 96x96, tertiary relief 92x96, danger chip 40x40
arrangement: flush modular grid right of x=480, pitch from space-6, corners from radius-lg / radius-sm
pattern: dot grid at space-2 pitch cut in card over the accent slab; chosen because this is a terminal-driven crew — a measured grid, not decoration
scales: space-2 8 / space-4 16 / space-6 24, radius-lg 12 / radius-sm 4, weight 640 from type.groups.Text.display
-->
  <text class="name" x="40" y="196">Crew</text>
  <text class="tagline" x="44" y="240">Bot 队伍 · 暖白底，三档灰，一个绿</text>

  <rect class="brand tile" x="512" y="32" width="180" height="224"/>
  <g class="dot">
    <circle cx="544" cy="64" r="2.5"/><circle cx="568" cy="64" r="2.5"/><circle cx="592" cy="64" r="2.5"/><circle cx="616" cy="64" r="2.5"/><circle cx="640" cy="64" r="2.5"/><circle cx="664" cy="64" r="2.5"/>
    <circle cx="544" cy="88" r="2.5"/><circle cx="568" cy="88" r="2.5"/><circle cx="592" cy="88" r="2.5"/><circle cx="616" cy="88" r="2.5"/><circle cx="640" cy="88" r="2.5"/><circle cx="664" cy="88" r="2.5"/>
    <circle cx="544" cy="112" r="2.5"/><circle cx="568" cy="112" r="2.5"/><circle cx="592" cy="112" r="2.5"/><circle cx="616" cy="112" r="2.5"/><circle cx="640" cy="112" r="2.5"/><circle cx="664" cy="112" r="2.5"/>
  </g>

  <rect class="deep tile" x="708" y="32" width="220" height="104"/>
  <rect class="signal tile" x="708" y="152" width="104" height="104"/>
  <rect class="relief tile" x="828" y="152" width="100" height="104"/>
  <rect class="alert chip" x="888" y="40" width="32" height="32"/>
</svg>
</body>
</html>
