<!-- @dsCard group="Surfaces" height=232 subtitle="工单卡：用结构分层，不用近白面" -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:var(--surface);
         font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; padding:22px 28px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg);
          padding:16px; max-width:360px; }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .title { font-size:15px; font-weight:640; color:var(--ink); }
  .state { font-size:11px; padding:3px 9px; border-radius:var(--radius-sm);
           background:var(--accent-soft); color:var(--accent); }
  .sub { font-size:12px; color:var(--tertiary); margin-top:6px; }
  .rule { height:1px; background:var(--line); margin:14px 0 12px; }
  .track { height:4px; border-radius:var(--radius-sm); background:var(--selected); overflow:hidden; }
  .fill { height:100%; width:33%; background:var(--accent); border-radius:var(--radius-sm); }
  .foot { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:10px; }
  .link { color:var(--accent); }
  .note { font-size:12px; color:var(--tertiary); margin-top:16px; line-height:1.7; max-width:360px; }
  .note code { color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="top"><span class="title">调开登录页间距</span><span class="state">进行中</span></div>
    <div class="sub">码农 · 第 2 步 / 共 3 步</div>
    <div class="rule"></div>
    <div class="track"><div class="fill"></div></div>
    <div class="foot"><span>已跑 2 分钟</span><span class="link">看它怎么做 →</span></div>
  </div>
  <div class="note">
    旧版靠 <code>raised / faintSurface / warmWhite</code> 等九种近白面做层，彼此差 1~3%，屏幕上等于没有层。<br>
    现在只用 <code>--card</code> + <code>--line</code> + <code>--space-4</code> + 字重：<code>selected</code> 与底色差 14.6%，<code>line</code> 差 27.2%。
  </div>
</body>
</html>
