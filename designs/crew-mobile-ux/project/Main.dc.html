<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>聊天首屏（单行顶栏）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3E6B62}a:hover{color:#2E5D52}
.crew *{box-sizing:border-box}
.crew input::placeholder{color:#57524A;opacity:1}
</style>
</helmet>

<!-- 聊天首屏（静态布局画板，原生控件语义、无假 onClick）。顶部应用控制区 = 安全区24 + 单行56 = 80dp；不再常驻模式行/成员行/通知块。侧边栏见 Drawer.dc.html。收件人在输入区可点 label 显示。消息为示例数据。 -->
<div class="crew" style="width:390px;height:844px;display:flex;flex-direction:column;background:#FBF9F6;font-family:'Noto Sans SC',system-ui,sans-serif;color:#1F1D1A;overflow:hidden">

  <!-- 系统安全区占位（不虚构状态栏 UI）24 -->
  <div style="height:24px;flex:none" aria-hidden="true"></div>

  <!-- 单行顶栏 56：menu(48) · 会话(48,可点切换) · 连接状态(可点详情)。无更多⋯，其功能全部下沉 drawer。 -->
  <div style="height:56px;padding:0 6px;display:flex;align-items:center;gap:4px;flex:none">
    <button aria-label="打开侧边栏" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:10px;cursor:pointer;flex:none">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="#1F1D1A" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <!-- 中间：当前会话名，占可用宽，可点切换会话。聊天页显示会话名；任务页显示「任务 · 会话名」以区分所在页。 -->
    <button style="height:48px;min-width:0;flex:1;padding:0 8px;display:flex;align-items:center;gap:6px;background:transparent;border:none;border-radius:9px;font-size:15px;color:#1F1D1A;font-weight:600;cursor:pointer">
      <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">main</span>
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="flex:none"><path d="M3 4.5l3 3 3-3" fill="none" stroke="#57524A" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <!-- 右：连接状态，单短词限宽，48 命中 -->
    <button aria-label="连接状态：局域网，点击查看详情" style="height:48px;max-width:76px;padding:0 8px;display:flex;align-items:center;gap:5px;background:transparent;border:none;border-radius:9px;cursor:pointer;flex:none">
      <span style="width:8px;height:8px;border-radius:50%;background:#3E6B62;flex:none"></span>
      <span style="font-size:12.5px;color:#3E6B62;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">局域网</span>
    </button>
  </div>

  <!-- 消息区（弹性，示例数据；通知作为列表内一条可滚动项，默认 1 行摘要可展开） -->
  <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;padding:8px 14px 0;gap:12px">

    <!-- 通知：列表内一条，非常驻独立块；默认一行摘要，原生 button 展开 -->
    <div style="background:#EAF1EC;border-radius:10px;padding:3px">
      <button aria-expanded="false" aria-label="展开通知" style="width:100%;min-height:44px;display:flex;align-items:center;gap:8px;padding:3px 8px;background:transparent;border:none;cursor:pointer;text-align:left">
        <span style="width:6px;height:6px;border-radius:50%;background:#3E6B62;flex:none"></span>
        <span style="font-size:12.5px;color:#2E5D52;font-weight:600;flex:none">有事记得看一下 · 1</span>
        <span style="font-size:12px;color:#57524A;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">11月15日早报：自 21:00 起办完 1 件</span>
        <span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;margin:-3px -3px -3px 0">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 5.5l3 3 3-3" fill="none" stroke="#2E5D52" stroke-width="1.4" stroke-linecap="round"/></svg>
        </span>
      </button>
    </div>

    <!-- 我方消息（示例） -->
    <div style="display:flex;justify-content:flex-end">
      <div style="max-width:82%;background:#2C2A26;color:#FBF9F6;font-size:14px;line-height:1.45;padding:10px 13px;border-radius:14px 14px 4px 14px">在桌面写个 ok.txt 内容是 done</div>
    </div>

    <!-- 成员消息 · 大哥 -->
    <div style="display:flex;gap:9px">
      <span style="width:30px;height:30px;border-radius:8px;background:#3E6B62;color:#FBF9F6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none">大</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;color:#57524A;margin-bottom:4px">大哥</div>
        <div style="background:#FFFFFF;border:1px solid #EDE8E1;border-radius:4px 14px 14px 14px;padding:10px 13px;font-size:14px;line-height:1.5;color:#1F1D1A">
          收到：在桌面新建 ok.txt，内容写 done。
        </div>
        <button style="margin-top:5px;height:48px;padding:0 14px;background:transparent;border:1px solid #EDE8E1;border-radius:8px;font-size:12px;color:#57524A;cursor:pointer;display:flex;align-items:center;gap:6px">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h1.6M6 2v1.6M6 8.4V10M10 6H8.4" stroke="#57524A" stroke-width="1.2" stroke-linecap="round"/><path d="M3.5 8.5l.9-.9M8.5 3.5l-.9.9" stroke="#57524A" stroke-width="1.2" stroke-linecap="round"/></svg>
          听播报
        </button>
      </div>
    </div>

    <!-- 成员完成回执 -->
    <div style="display:flex;gap:9px">
      <span style="width:30px;height:30px;border-radius:8px;background:#3E6B62;color:#FBF9F6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none">大</span>
      <div style="flex:1;min-width:0">
        <div style="background:#FFFFFF;border:1px solid #EDE8E1;border-radius:4px 14px 14px 14px;padding:10px 13px;font-size:14px;line-height:1.5;color:#1F1D1A">
          已在桌面新建 ok.txt，内容为 done，并复核过内容正确。
        </div>
      </div>
    </div>

    <!-- 我方消息（示例） -->
    <div style="display:flex;justify-content:flex-end">
      <div style="max-width:82%;background:#2C2A26;color:#FBF9F6;font-size:14px;line-height:1.45;padding:10px 13px;border-radius:14px 14px 4px 14px">以后都先说结论</div>
    </div>

  </div>

  <!-- 输入区 64：单行。左侧 48×48 收件人按钮（名字 1–3 字单行 ellipsis、最大 64dp，点开 drawer 选人；「发给」在 contentDescription，视觉直接「大哥⌄」），正文 TextField flex 吃剩余宽（360dp 下约 180dp），用户原始 @ 也在正文可见。不加第二排、不叠点击层。默认收件人由后端该会话 default 角色决定（示例，不硬编码第一位）。 -->
  <form style="height:64px;padding:0 12px;display:flex;align-items:center;gap:8px;border-top:1px solid #EDE8E1;background:#FBF9F6;flex:none">
    <button type="button" aria-label="发给：大哥（示例）。点击打开侧边栏选择成员" style="width:48px;max-width:64px;height:48px;padding:0 8px;display:flex;align-items:center;gap:4px;background:#EAF1EC;border:1px solid #C6DBD2;border-radius:13px;cursor:pointer;flex:none">
      <span style="min-width:0;font-size:12.5px;color:#2E5D52;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">大哥</span>
      <svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true" style="flex:none"><path d="M3 4.5l3 3 3-3" fill="none" stroke="#2E5D52" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <label for="crew-reply" style="flex:1;min-width:0;display:block">
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">说点什么</span>
      <input id="crew-reply" type="text" placeholder="说点什么" style="width:100%;height:48px;padding:0 14px;background:#F3F0EA;border:1px solid #EDE8E1;border-radius:13px;font-size:14px;color:#1F1D1A;font-family:inherit">
    </label>
    <button type="submit" style="height:48px;min-width:56px;padding:0 16px;background:#3E6B62;color:#FBF9F6;border:none;border-radius:13px;font-size:14px;font-weight:600;cursor:pointer;flex:none">发送</button>
  </form>

  <!-- 底部系统安全区占位（不虚构 UI）22 -->
  <div style="height:22px;flex:none" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
