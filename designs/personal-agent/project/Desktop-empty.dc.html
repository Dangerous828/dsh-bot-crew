<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Personal Agent · 空态</title>
<script src="./support.js"></script>
</head>

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; display: flex; background: #FBF9F6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; color: #1F1D1A">

  <aside style="width: 300px; flex: none; display: flex; flex-direction: column; gap: 18px; padding: 22px 14px; background: #FFFFFF; border-right: 1px solid #EDE8E1">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
      <div style="display: flex; align-items: center; gap: 9px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F1D1A" stroke-width="1.5" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke-dasharray="2.5 3"/>
          <circle cx="12" cy="12" r="3" fill="#1F1D1A" stroke="none"/>
        </svg>
        <span style="font-size: 15.5px; font-weight: 640; letter-spacing: -0.01em">我的队伍</span>
      </div>
      <button type="button" aria-label="新增一位 Bot" style="width: 28px; height: 28px; border-radius: 8px; border: 1px solid #EDE8E1; background: #FFFFFF; color: #8A8377; font-size: 17px; cursor: pointer; line-height: 1">+</button>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px 16px; text-align: center">
      <div style="width: 52px; height: 52px; border-radius: 16px; border: 1px dashed #D9D3C9; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B8B1A5" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
      </div>
      <div style="font-size: 13px; color: #57524A; line-height: 1.6">队伍还是空的。<br>加一位 Bot，他从今天起会记住你们的每一次对话。</div>
      <button type="button" style="padding: 8px 16px; border-radius: 9px; border: none; background: #3E6B62; color: #FFFFFF; font-size: 12.5px; font-weight: 550; cursor: pointer">加第一位</button>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid #EDE8E1; padding-top: 14px">
      <span style="display: flex; align-items: center; gap: 9px; padding: 9px 8px; font-size: 13px; color: #B8B1A5">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.6"/><rect x="3" y="14" width="18" height="6" rx="1.6"/></svg>
        后台
      </span>
      <span style="display: flex; align-items: center; gap: 9px; padding: 9px 8px; font-size: 13px; color: #B8B1A5">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        常规任务
      </span>
    </div>
  </aside>

  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #FBF9F6; padding: 40px">
    <div style="width: 64px; height: 64px; border-radius: 20px; border: 1px dashed #D9D3C9; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B8B1A5" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16v10H8l-4 4z"/></svg>
    </div>
    <div style="font-size: 15px; font-weight: 600; color: #57524A">还没有人说话</div>
    <div style="font-size: 13px; color: #A9A294; text-align: center; line-height: 1.6; max-width: 320px">队伍里还没有 Bot。加一位之后，你在这里跟他说的话，他会一直记得。</div>
  </main>

  <aside style="width: 360px; flex: none; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 20px; background: #F8F5F1; border-left: 1px solid #EDE8E1">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 12.5px; font-weight: 640">后台</span>
      <span style="font-size: 11.5px; color: #8A8377">0 张</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 36px 12px; text-align: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9C2B6" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.6"/><rect x="3" y="14" width="18" height="6" rx="1.6"/></svg>
      <span style="font-size: 12px; color: #A9A294; line-height: 1.6">还没有工单。<br>队伍接到的活会出现在这里。</span>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 7px; padding-top: 12px; border-top: 1px solid #EDE8E1">
      <div style="display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: #57524A">
        <span>运行状态</span>
        <span style="display: flex; align-items: center; gap: 5px; color: #3E6B62">
          <span style="width: 5px; height: 5px; border-radius: 50%; background: #3E6B62"></span>就绪
        </span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: #8A8377">
        <span>队列</span>
        <span>空闲</span>
      </div>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
