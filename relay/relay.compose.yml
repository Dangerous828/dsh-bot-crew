# dsh-bot-crew 中转。放在 relay/ 目录下，与 Dockerfile 同级。
#
# 用法（NAS 上）：
#   docker compose -f relay.compose.yml up -d
#   docker compose -f relay.compose.yml logs -f
#
# 为什么端口只绑局域网地址：这个中转本身不提供 TLS。公网那一段由 Cloudflare Tunnel 或
# NAS 上的 Caddy 终结。把端口开到 0.0.0.0，等于让明文 ws:// 直接对着公网 —— 手机带着设备
# 凭据走明文，凭据就在链路上裸奔。
#
# NAS 上的实际取值（2026-11-10 部署完成，已实测）：
#   宿主端口 18800（容器内仍是 8787，镜像里写死的 RELAY_PORT 不改）
#   宿主 127.0.0.1:8787 已被 devgame-act 占用，18800 避开它，也避开 8080/8642/1883
#   这里只绑局域网地址 192.168.31.152；反代在 jarvis-caddy 容器里，它走宿主 LAN 地址进来
#   （实测可达）。不绑 127.0.0.1 是刻意的：避免明文 ws:// 被当成可用的公网入口。
#
#   公网入口（2026-11-10 实测）：relay.kentonnie.top 已被 AI-HUB 的 dsh-relay 占用，不能动；
#   本服务挂在既有域名的子路径下：
#     https://jarvis.kentonnie.top/crew-relay/health
#     wss://jarvis.kentonnie.top/crew-relay/tunnel
#     https://jarvis.kentonnie.top/crew-relay/i/<instanceId>/api/mobile/...
#   jarvis-caddy 里对应一条 handle_path /crew-relay/* → http://192.168.31.152:18800。
services:
  crew-relay:
    image: dsh-bot-crew-relay:0.1.0
    # 想直接在 NAS 上构建就把上面一行换成：
    # build: .
    container_name: crew-relay
    restart: unless-stopped
    ports:
      - "192.168.31.152:18800:8787"
    environment:
      # 宿主注册时出示的密钥。不设的话任何人都能抢注一个 instanceId。
      # 轮换方式：改这里 → up -d，然后改宿主那边的 CREW_RELAY_SECRET。
      RELAY_REGISTER_SECRET: "${CREW_RELAY_SECRET:?set CREW_RELAY_SECRET in .env}"
      # 健康检查的详细视图（列出谁的机器在线）。不设就只给公开视图。
      RELAY_ADMIN_TOKEN: "${CREW_RELAY_ADMIN_TOKEN:-}"
      # 超时与上限。缺省值见 relay/src/main.ts。
      RELAY_HEARTBEAT_MS: "15000"
      RELAY_PONG_TIMEOUT_MS: "60000"
      RELAY_RESPONSE_TIMEOUT_MS: "120000"
      RELAY_MAX_BODY_BYTES: "262144"
      RELAY_MAX_INFLIGHT: "64"
      RELAY_AUTH_FAILURE_LIMIT: "20"
    # 日志上限：公网暴露面的日志会被试探填满。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # 容器内探测走 8787（镜像里的 RELAY_PORT）；宿主端口只影响外面怎么连，不影响容器里。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
